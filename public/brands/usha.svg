<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <g transform="translate(10, 10)">
    <!-- Red Square U -->
    <rect x="0" y="10" width="80" height="80" rx="10" fill="#E52320"/>
    <text x="40" y="68" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" text-anchor="middle">U</text>

    <!-- Red Square S -->
    <rect x="90" y="10" width="80" height="80" rx="10" fill="#E52320"/>
    <text x="130" y="68" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" text-anchor="middle">S</text>

    <!-- Red Square H -->
    <rect x="180" y="10" width="80" height="80" rx="10" fill="#E52320"/>
    <text x="220" y="68" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" text-anchor="middle">H</text>

    <!-- Red Square A -->
    <rect x="270" y="10" width="80" height="80" rx="10" fill="#E52320"/>
    <text x="310" y="68" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" text-anchor="middle">A</text>

    <!-- Registered symbol -->
    <text x="360" y="25" font-family="sans-serif" font-weight="bold" font-size="16" fill="#E52320">®</text>
  </g>
</svg>
